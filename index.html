<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asistente de Truco AI</title>
    <style>
        :root {
            --bg: #0e0e10;
            --card-bg: #18181b;
            --border: #27272a;
            --primary: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        header { text-align: center; padding: 8px 0; }
        header h1 { font-size: 1.4rem; font-weight: 700; }
        header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }

        input[type="password"]:focus { border-color: var(--primary); }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        .badge {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge.active { color: var(--primary); }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); color: #000; }
        .btn-warning { background-color: var(--warning); color: #000; }
        .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }

        .log-box {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            min-height: 60px;
            max-height: 100px;
            overflow-y: auto;
            word-break: break-word;
        }

        /* Modo Bolsillo */
        #pocket-mode-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: #000000;
            z-index: 99999;
            touch-action: manipulation;
        }

        #pocket-mode-overlay.active { display: block; }

        .exit-pocket-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: #333;
            border: 1px solid #111;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Truco Vision AI</h1>
            <p>Asistente de cartas en tiempo real</p>
        </header>

        <div class="card">
            <label for="api-key">Gemini API Key</label>
            <input type="password" id="api-key" placeholder="Pegá tu API Key aquí..." autocomplete="off">
        </div>

        <div class="card">
            <div class="video-container">
                <video id="webcam" autoplay playsinline muted></video>
                <div id="cam-status" class="badge">
                    <span class="dot"></span>
                    <span id="cam-status-text">Cámara apagada</span>
                </div>
            </div>

            <button id="btn-cam" class="btn btn-outline" onclick="toggleCamara()">Iniciar Cámara Trasera</button>
            <button class="btn btn-primary" onclick="analizarMesa()">Analizar Mesa 📸</button>
            <button class="btn btn-warning" onclick="activarModoBolsillo()">Activar Modo Bolsillo 👁️</button>
        </div>

        <div class="card">
            <label>Estado / Respuesta</label>
            <div id="log" class="log-box">Listo para iniciar.</div>
        </div>
    </div>

    <!-- Pantalla negra para el bolsillo -->
    <div id="pocket-mode-overlay" onclick="handlePocketTap(event)">
        <button class="exit-pocket-btn" onclick="event.stopPropagation(); desactivarModoBolsillo();">Salir</button>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const logBox = document.getElementById('log');
        const apiKeyInput = document.getElementById('api-key');
        const camStatus = document.getElementById('cam-status');
        const camStatusText = document.getElementById('cam-status-text');
        const btnCam = document.getElementById('btn-cam');
        const pocketOverlay = document.getElementById('pocket-mode-overlay');

        let stream = null;
        let wakeLock = null;
        let isProcessing = false;

        // Recuperar la clave guardada en memoria
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('truco_gemini_key');
            if (savedKey) apiKeyInput.value = savedKey;
        });

        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('truco_gemini_key', apiKeyInput.value.trim());
        });

        function log(msg) {
            const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            logBox.innerText = `[${timestamp}] ${msg}`;
            console.log(msg);
        }

        async function toggleCamara() {
            if (stream) detenerCamara();
            else await iniciarCamara();
        }

        async function iniciarCamara() {
            log("Conectando cámara...");
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
            } catch (err) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" },
                        audio: false
                    });
                } catch (e) {
                    log("Error de cámara: " + e.message);
                    return false;
                }
            }

            video.srcObject = stream;
            camStatus.classList.add('active');
            camStatusText.innerText = "Cámara Activa";
            btnCam.innerText = "Detener Cámara";
            log("Cámara conectada.");
            return true;
        }

        function detenerCamara() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                video.srcObject = null;
                camStatus.classList.remove('active');
                camStatusText.innerText = "Cámara apagada";
                btnCam.innerText = "Iniciar Cámara Trasera";
                log("Cámara detenida.");
            }
        }

        async function analizarMesa() {
            if (isProcessing) return;

            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                const msg = "Ingresá una API Key válida";
                log(msg);
                hablar(msg);
                return;
            }

            if (!stream) {
                const ok = await iniciarCamara();
                if (!ok) return;
            }

            isProcessing = true;
            vibrar(60);
            log("Analizando imagen...");

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const base64Data = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];

            // Endpoint usando Gemini 2.0 Flash
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
            const promptTexto = "Identifica las cartas de Truco visibles en la mesa y dame la mejor jugada corta en 5 palabras.";

            const requestBody = {
                contents: [{
                    parts: [
                        { text: promptTexto },
                        { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                    ]
                }]
            };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await res.json();

                if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                    const respuesta = data.candidates[0].content.parts[0].text.trim();
                    log("IA: " + respuesta);
                    vibrar([40, 60, 40]);
                    hablar(respuesta);
                } else if (data.error) {
                    log("Error API: " + data.error.message);
                    hablar("Error en la clave de API");
                } else {
                    log("No se pudo interpretar la imagen.");
                    hablar("No vi cartas claras");
                }
            } catch (err) {
                log("Error de conexión: " + err.message);
                hablar("Error de conexión");
            } finally {
                isProcessing = false;
            }
        }

        function hablar(texto) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function vibrar(patron) {
            if ('vibrate' in navigator) navigator.vibrate(patron);
        }

        async function activarModoBolsillo() {
            if (!stream) {
                const ok = await iniciarCamara();
                if (!ok) return;
            }
            pocketOverlay.classList.add('active');
            solicitarWakeLock();
            log("Modo Bolsillo Activo");
            vibrar(100);
        }

        function desactivarModoBolsillo() {
            pocketOverlay.classList.remove('active');
            liberarWakeLock();
            log("Modo Bolsillo Desactivado");
            vibrar(50);
        }

        function handlePocketTap(event) {
            analizarMesa();
        }

        async function solicitarWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
        }

        function liberarWakeLock() {
            if (wakeLock) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }
    </script>
</body>
</html>
