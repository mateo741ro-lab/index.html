<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cámara Fútbol Pro - Monitor</title>

  <!-- Librería PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-green: #238636;
      --accent-red: #da3633;
      --accent-blue: #1f6beb;
      --accent-yellow: #d29922;
      --text-color: #f0f6fc;
      --subtext-color: #8b949e;
      --border-color: #30363d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
    
    header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h1 { font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    h1 span { color: var(--accent-green); }

    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; }

    /* CÁMARA */
    .camera-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background-color: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* INDICADORES */
    .rec-indicator { position: absolute; top: 12px; left: 12px; background-color: rgba(0, 0, 0, 0.7); padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: bold; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background-color: #8b949e; }
    .recording .dot { background-color: var(--accent-red); animation: blink 1s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .cam-switch-btn { position: absolute; top: 12px; right: 12px; background-color: rgba(0, 0, 0, 0.7); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }

    /* CONTROLES Y TARJETAS */
    .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.75rem; color: var(--subtext-color); font-weight: 700; text-transform: uppercase; }
    input[type="text"] { background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 12px; border-radius: 8px; font-size: 1rem; outline: none; }
    
    .action-buttons { display: flex; gap: 10px; }
    button.btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; text-transform: uppercase; }
    .btn-record { background-color: var(--accent-green); color: #fff; }
    .btn-stop { background-color: var(--accent-red); color: #fff; display: none; }
    
    /* SECCIÓN MONITOR EN VIVO (Nueva) */
    .monitor-panel { border: 1px dashed var(--accent-blue); background-color: rgba(31, 107, 235, 0.05); }
    .monitor-panel label { color: var(--accent-blue); }
    .qr-row { display: flex; gap: 12px; align-items: center; }
    .qr-img { width: 100px; height: 100px; background: #fff; padding: 4px; border-radius: 8px; flex-shrink: 0; }
    .link-controls { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow: hidden; }
    .link-controls input { padding: 8px; font-size: 0.85rem; }
    .link-buttons { display: flex; gap: 6px; }
    .btn-sm { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; color: #fff; text-align: center; text-decoration: none; }
    
    /* MODO ESPECTADOR (MONITOR) */
    .viewer-warning { background-color: rgba(210, 153, 34, 0.15); border: 1px solid var(--accent-yellow); color: #f0f6fc; padding: 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; margin-bottom: 12px; display: flex; gap: 10px; align-items: center;}
    .viewer-warning span { font-size: 1.5rem; }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- MODO 1: GRABADOR PRINCIPAL (En el poste) -->
  <!-- ========================================== -->
  <div id="recorder-app" class="container">
    <header>
      <h1>CÁMARA<span>FÚTBOL</span></h1>
    </header>

    <div class="camera-box">
      <video id="preview" autoplay playsinline muted></video>
      <div class="rec-indicator" id="recIndicator">
        <div class="dot"></div>
        <span id="timerDisplay" style="font-family: monospace;">00:00:00</span>
      </div>
      <button class="cam-switch-btn" id="switchCamBtn">🔄 Cámara</button>
    </div>

    <div class="card">
      <div class="input-group">
        <label for="matchTitle">Nombre del Partido</label>
        <input type="text" id="matchTitle" value="Partido_Fecha_1">
      </div>
      <div class="action-buttons">
        <button class="btn btn-record" id="recordBtn">🔴 GRABAR</button>
        <button class="btn btn-stop" id="stopBtn">⏹ DETENER</button>
      </div>
    </div>

    <!-- PANEL DEL MONITOR EN VIVO (Siempre visible al inicio) -->
    <div class="card monitor-panel">
      <label>📡 COMPARTIR CÁMARA EN VIVO</label>
      <div class="qr-row">
        <img id="qrImage" class="qr-img" src="" alt="Cargando QR...">
        <div class="link-controls">
          <input type="text" id="monitorLinkInput" readonly>
          <div class="link-buttons">
            <button class="btn-sm" id="copyMonitorBtn" style="background: var(--accent-blue);">Copiar</button>
            <a class="btn-sm" id="wspMonitorBtn" href="#" target="_blank" style="background: #25D366;">WhatsApp</a>
          </div>
        </div>
      </div>
      <div id="peerStatus" style="font-size: 0.8rem; color: var(--subtext-color); text-align: center; margin-top: 5px;">
        Generando conexión segura...
      </div>
    </div>

    <!-- Resultados (Descarga/Nube) -->
    <div class="card" id="outputCard" style="display: none;">
      <label>VIDEO GENERADO</label>
      <div class="action-buttons">
        <button class="btn" id="downloadBtn" style="background: #30363d; color: white;">⬇️ Guardar en mi celular</button>
      </div>
      <button class="btn" id="uploadBtn" style="margin-top: 5px; background: var(--accent-blue); color: white;">☁️ Subir a Gofile y Compartir</button>
      <div id="statusMsg" style="font-size: 0.85rem; margin-top: 10px; color: var(--accent-green);"></div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- MODO 2: VISOR DEL MONITOR (Espectador) -->
  <!-- ========================================== -->
  <div id="viewer-app" class="container" style="display: none;">
    <header>
      <h1>MONITOR<span>EN VIVO</span></h1>
      <div id="viewerStatus" style="font-size: 0.75rem; color: var(--accent-yellow);">Conectando... 🟡</div>
    </header>

    <div class="viewer-warning">
      <span>⚠️</span>
      <div>
        <strong>ESTA NO ES LA CALIDAD ORIGINAL</strong><br>
        Estás viendo una vista previa comprimida por internet para comprobar el encuadre. El teléfono del poste está grabando en Full HD.
      </div>
    </div>

    <div class="camera-box">
      <video id="viewerVideo" autoplay playsinline></video>
    </div>
  </div>


  <script>
    // ========================================================
    // DETECCIÓN DE MODO: ¿Grabador o Monitor?
    // ========================================================
    const urlParams = new URLSearchParams(window.location.search);
    const hostPeerId = urlParams.get('view');

    if (hostPeerId) {
      document.getElementById('recorder-app').style.display = 'none';
      document.getElementById('viewer-app').style.display = 'flex';
      initViewerMode(hostPeerId);
    } else {
      initRecorderMode();
    }

    // ========================================================
    // LÓGICA DEL MODO GRABADOR (Dispositivo Principal)
    // ========================================================
    let currentStream;
    let peer;

    async function initRecorderMode() {
      // 1. GENERACIÓN INSTANTÁNEA DE QR Y ENLACE (Antes de conectar a la red)
      const myUniqueId = 'camfut-' + Math.random().toString(36).substring(2, 9);
      const generatedViewerUrl = window.location.href.split('?')[0] + '?view=' + myUniqueId;
      
      // Mostrar QR e Inputs en milésimas de segundo
      document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(generatedViewerUrl)}&bgcolor=FFFFFF`;
      document.getElementById('monitorLinkInput').value = generatedViewerUrl;
      const wspMsg = encodeURIComponent(`⚽ ¡Entra a este link para ver la cámara en vivo y ayudarme a apuntar la cancha!\n\n${generatedViewerUrl}`);
      document.getElementById('wspMonitorBtn').href = `whatsapp://send?text=${wspMsg}`;

      // Lógica de Copiar
      document.getElementById('copyMonitorBtn').addEventListener('click', () => {
        const input = document.getElementById('monitorLinkInput');
        input.select();
        document.execCommand("copy");
        document.getElementById('copyMonitorBtn').innerText = "¡Copiado!";
        setTimeout(() => { document.getElementById('copyMonitorBtn').innerText = "Copiar"; }, 2000);
      });

      // 2. INICIAR CÁMARA
      let facingMode = 'environment';
      const preview = document.getElementById('preview');
      
      async function startCamera() {
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode, width: { ideal: 1920 } }, audio: true });
          preview.srcObject = currentStream;
        } catch (err) { alert("Error al acceder a la cámara."); }
      }
      await startCamera();

      document.getElementById('switchCamBtn').addEventListener('click', () => {
        facingMode = facingMode === 'environment' ? 'user' : 'environment';
        startCamera();
      });

      // 3. CONEXIÓN A LA RED EN SEGUNDO PLANO
      const peerStatus = document.getElementById('peerStatus');
      
      // Forzamos la creación del servidor usando el ID que ya le mostramos al usuario
      // y agregamos servidores STUN gratuitos de Google para evitar bloqueos móviles.
      peer = new Peer(myUniqueId, {
        config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
      }); 

      peer.on('open', () => {
        peerStatus.innerText = "✅ Red conectada. Esperando espectador...";
        peerStatus.style.color = "var(--accent-green)";
      });

      peer.on('error', (err) => {
        console.error(err);
        peerStatus.innerText = "⚠️ Error de red. El Wi-Fi/4G está bloqueando la conexión.";
        peerStatus.style.color = "var(--accent-red)";
      });

      peer.on('connection', (conn) => {
        conn.on('data', (data) => {
          if (data === 'VIEWER_READY' && currentStream) {
            peer.call(conn.peer, currentStream);
            peerStatus.innerText = "👁️ Un amigo está viendo la cámara en vivo";
            peerStatus.style.color = "var(--accent-blue)";
          }
        });
      });

      // ==========================================
      // 4. LÓGICA DE GRABACIÓN
      // ==========================================
      let mediaRecorder; let recordedChunks = []; let startTime; let timerInterval; let recordedBlob;
      const recordBtn = document.getElementById('recordBtn'); const stopBtn = document.getElementById('stopBtn');
      
      recordBtn.addEventListener('click', () => {
        recordedChunks = [];
        try { mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/mp4' }); } 
        catch (e) { mediaRecorder = new MediaRecorder(currentStream); }

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          recordedBlob = new Blob(recordedChunks, { type: 'video/mp4' });
          document.getElementById('outputCard').style.display = 'flex';
          document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth' });
        };

        mediaRecorder.start(1000);
        recordBtn.style.display = 'none'; stopBtn.style.display = 'flex';
        document.getElementById('recIndicator').classList.add('recording');
        
        startTime = Date.now();
        timerInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - startTime) / 1000);
          const secs = String(elapsed % 60).padStart(2, '0');
          const mins = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
          document.getElementById('timerDisplay').innerText = `00:${mins}:${secs}`;
        }, 1000);
      });

      stopBtn.addEventListener('click', () => {
        mediaRecorder.stop();
        recordBtn.style.display = 'flex'; stopBtn.style.display = 'none';
        document.getElementById('recIndicator').classList.remove('recording');
        clearInterval(timerInterval);
      });

      // 5. DESCARGA Y NUBE (Gofile)
      document.getElementById('downloadBtn').addEventListener('click', () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(recordedBlob);
        a.download = `${document.getElementById('matchTitle').value}.mp4`;
        a.click();
      });

      document.getElementById('uploadBtn').addEventListener('click', async () => {
        if(!recordedBlob) return;
        const btn = document.getElementById('uploadBtn');
        const msg = document.getElementById('statusMsg');
        btn.innerText = "⏳ Subiendo..."; btn.disabled = true;
        try {
          const sRes = await fetch('https://api.gofile.io/servers');
          const sData = await sRes.json();
          const server = sData.data.servers[0].name;
          
          const fd = new FormData(); fd.append('file', recordedBlob, "partido.mp4");
          const uRes = await fetch(`https://${server}.gofile.io/contents/uploadfile`, { method: 'POST', body: fd });
          const uData = await uRes.json();
          
          msg.innerHTML = `✅ Link generado: <a href="${uData.data.downloadPage}" target="_blank" style="color:var(--accent-blue)">ABRIR VIDEO</a>`;
          btn.innerText = "☁️ Subido con éxito";
        } catch (e) { msg.innerText = "❌ Error al subir."; btn.disabled = false; btn.innerText = "☁️ Reintentar"; }
      });
    }

    // ========================================================
    // LÓGICA DEL MODO VISOR (Celular del Espectador)
    // ========================================================
    function initViewerMode(targetId) {
      const viewerVideo = document.getElementById('viewerVideo');
      const viewerStatus = document.getElementById('viewerStatus');
      
      const viewerPeer = new Peer({ config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] } }); 

      viewerPeer.on('open', () => {
        viewerStatus.innerText = "Conectando al poste... 🟡";
        const conn = viewerPeer.connect(targetId);
        
        conn.on('open', () => {
          conn.send('VIEWER_READY'); 
        });
      });

      viewerPeer.on('call', (call) => {
        call.answer(); 
        viewerStatus.innerText = "Recibiendo señal... 🟡";
        
        call.on('stream', (remoteStream) => {
          viewerVideo.srcObject = remoteStream;
          viewerStatus.innerText = "EN VIVO 🟢";
          viewerStatus.style.color = "var(--accent-green)";
        });
      });

      viewerPeer.on('error', (err) => {
        viewerStatus.innerText = "Error de red 🔴";
        viewerStatus.style.color = "var(--accent-red)";
      });
    }
  </script>
</body>
</html>
