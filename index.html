<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comunicador - Cartas</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-color: #4CAF50;
            
            /* Colores de las cartas */
            --c-oro: #ffd700;
            --c-copa: #ff4757;
            --c-espada: #1e90ff;
            --c-basto: #2ed573;
        }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; text-align: center;
            transition: background-color 0.05s; /* Muy rápido para el flash */
        }
        h1 { margin-top: 20px; font-size: 1.3rem; color: #aaa;}
        
        .status-badge {
            margin: 10px 0 20px 0; padding: 8px 20px; border-radius: 20px;
            font-weight: bold; background: #333; font-size: 0.9rem;
        }
        .status-badge.connected { background: var(--accent-color); color: #000; }
        .status-badge.error { background: #ff4757; color: #fff; }

        /* Contenedores */
        #setup-screen, #active-screen {
            width: 100%; max-width: 400px; padding: 15px; box-sizing: border-box;
        }
        #active-screen { display: none; } 

        /* SECCIÓN DE EMPAREJAMIENTO */
        #qr-section { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; }
        #qr-canvas { background: white; padding: 10px; border-radius: 10px; margin-bottom: 15px;}
        .help-text { font-size: 0.85rem; color: #aaa; margin: 10px 0; }
        .link-box {
            width: 100%; padding: 10px; border-radius: 8px;
            border: 1px solid #555; background: #222; color: var(--accent-color);
            font-size: 0.8rem; box-sizing: border-box; text-align: center;
        }

        /* PANEL DE BOTONES (CARTAS) */
        .btn-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            margin-top: 10px; 
        }
        
        .btn-carta {
            border: none; border-radius: 20px; padding: 30px 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            transition: transform 0.1s;
            user-select: none; -webkit-user-select: none;
        }
        .btn-carta:active { transform: scale(0.92); }
        .btn-carta:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .btn-carta .icono { font-size: 3.5rem; margin-bottom: 5px; }
        .btn-carta .nombre { font-size: 1.3rem; font-weight: bold; color: #000; margin-bottom: 5px;}
        .btn-carta .ritmo { font-size: 0.8rem; color: rgba(0,0,0,0.7); font-weight: 600;}

        /* Colores específicos */
        .btn-oro { background-color: var(--c-oro); }
        .btn-copa { background-color: var(--c-copa); }
        .btn-espada { background-color: var(--c-espada); }
        .btn-basto { background-color: var(--c-basto); }

        /* VISUALIZADOR DE RECEPCIÓN */
        #receive-area {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            min-height: 100px;
            display: flex; flex-direction: column; justify-content: center;
        }
        #last-signal {
            font-size: 2.5rem; font-weight: bold; color: #555;
            margin: 0; line-height: 1.2; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
    </style>
</head>
<body>

    <h1 id="main-title">Señas Ocultas</h1>
    <div id="status" class="status-badge">Inicializando...</div>

    <!-- PANTALLA DE EMPAREJAMIENTO -->
    <div id="setup-screen">
        <div id="qr-section">
            <p style="margin-top:0;"><strong>1.</strong> Escanea con el otro celular</p>
            <canvas id="qr-canvas"></canvas>
            <p class="help-text">O comparte este link directamente:</p>
            <input type="text" id="manual-link" class="link-box" readonly onclick="this.select();">
        </div>
    </div>

    <!-- PANTALLA DE CARTAS -->
    <div id="active-screen">
        <div id="receive-area">
            <div style="font-size: 0.9rem; color: #aaa; margin-bottom: 10px;">ÚLTIMA RECIBIDA:</div>
            <div id="last-signal">Ninguna</div>
        </div>
        
        <div class="btn-grid" id="button-container">
            <button class="btn-carta btn-oro" onclick="enviarSenal('ORO')">
                <span class="icono">🪙</span>
                <span class="nombre">ORO</span>
                <span class="ritmo">1 Corto</span>
            </button>
            <button class="btn-carta btn-copa" onclick="enviarSenal('COPA')">
                <span class="icono">🍷</span>
                <span class="nombre">COPA</span>
                <span class="ritmo">2 Cortos</span>
            </button>
            <button class="btn-carta btn-espada" onclick="enviarSenal('ESPADA')">
                <span class="icono">⚔️</span>
                <span class="nombre">ESPADA</span>
                <span class="ritmo">3 Cortos</span>
            </button>
            <button class="btn-carta btn-basto" onclick="enviarSenal('BASTO')">
                <span class="icono">🪵</span>
                <span class="nombre">BASTO</span>
                <span class="ritmo">1 Largo</span>
            </button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE LOS RITMOS DE VIBRACIÓN Y FLASH
        const RITMOS = {
            'ORO': { 
                color: 'var(--c-oro)', 
                icono: '🪙',
                // 150ms vibrando
                patron: [150] 
            },
            'COPA': { 
                color: 'var(--c-copa)', 
                icono: '🍷',
                // 150ms ON, 150ms pausa, 150ms ON
                patron: [150, 150, 150] 
            },
            'ESPADA': { 
                color: 'var(--c-espada)', 
                icono: '⚔️',
                // 150ms ON, 150ms pausa, 150ms ON, 150ms pausa, 150ms ON
                patron: [150, 150, 150, 150, 150] 
            },
            'BASTO': { 
                color: 'var(--c-basto)', 
                icono: '🪵',
                // 800ms vibrando corrido (Muy largo)
                patron: [800] 
            }
        };

        let peer;
        let conexion;
        let esHost = true;
        let bloqueado = false;
        
        const urlObj = new URL(window.location.href);
        const guestJoinId = urlObj.searchParams.get('join'); 
        if (guestJoinId) esHost = false;
        
        const UI = {
            status: document.getElementById('status'),
            setupScreen: document.getElementById('setup-screen'),
            activeScreen: document.getElementById('active-screen'),
            lastSignal: document.getElementById('last-signal'),
            manualLink: document.getElementById('manual-link')
        };

        function setStatus(text, state = 'normal') {
            UI.status.innerText = text;
            UI.status.className = 'status-badge';
            if (state === 'connected') UI.status.classList.add('connected');
            if (state === 'error') UI.status.classList.add('error');
        }

        function inicializar() {
            peer = new Peer();
            peer.on('open', (id) => {
                if (esHost) iniciarHost(id);
                else iniciarGuest(guestJoinId);
            });
            peer.on('error', (err) => {
                setStatus('Error de conexión', 'error');
            });
        }

        function iniciarHost(myId) {
            setStatus('Esperando compañero...');
            UI.setupScreen.style.display = 'block';

            const currentUrl = new URL(window.location.href);
            currentUrl.searchParams.set('join', myId);
            const joinUrl = currentUrl.toString();
            
            UI.manualLink.value = joinUrl;

            new QRious({ element: document.getElementById('qr-canvas'), value: joinUrl, size: 220 });

            peer.on('connection', configurarConexion);
        }

        function iniciarGuest(hostId) {
            setStatus('Conectando...');
            UI.setupScreen.style.display = 'none';
            configurarConexion(peer.connect(hostId));
        }

        function configurarConexion(conn) {
            conexion = conn;
            conexion.on('open', () => {
                setStatus('¡Conectados!', 'connected');
                UI.setupScreen.style.display = 'none';
                UI.activeScreen.style.display = 'block';
            });
            conexion.on('data', (data) => {
                if (data.carta) ejecutarRecepcion(data.carta);
            });
            conexion.on('close', () => {
                setStatus('Compañero desconectado', 'error');
                UI.activeScreen.style.display = 'none';
                if(esHost) UI.setupScreen.style.display = 'block';
            });
        }

        function enviarSenal(carta) {
            if (bloqueado || !conexion || !conexion.open) return; 
            
            bloqueado = true; // Bloquea los botones medio segundo para no hacer spam
            conexion.send({ carta: carta });
            
            // Reflejo visual propio sutil
            UI.lastSignal.innerHTML = `Enviando: ${RITMOS[carta].icono} ${carta}`;
            UI.lastSignal.style.color = '#888';
            
            setTimeout(() => { bloqueado = false; }, 500);
        }

        function ejecutarRecepcion(carta) {
            const config = RITMOS[carta];
            
            // 1. Mostrar en pantalla
            UI.lastSignal.innerHTML = `${config.icono} ${carta}`;
            UI.lastSignal.style.color = config.color;
            
            // 2. Vibración Física (Android)
            if (navigator.vibrate) {
                navigator.vibrate(config.patron);
            }

            // 3. Destello de Pantalla Exacto (Fallback iOS)
            // Recorre el array de tiempos. Los índices pares (0, 2, 4) ENCIENDEN, los impares (1, 3) APAGAN.
            let pasoActual = 0;

            function parpadear() {
                if (pasoActual >= config.patron.length) {
                    document.body.style.backgroundColor = 'var(--bg-color)'; // Fin, volver a negro
                    return; 
                }
                
                const tiempoActual = config.patron[pasoActual];
                
                // Si es un índice par (0, 2, 4...) es tiempo de vibrar/iluminar
                if (pasoActual % 2 === 0) {
                    document.body.style.backgroundColor = config.color;
                } else {
                    // Si es impar (1, 3...) es tiempo de pausa/oscuridad
                    document.body.style.backgroundColor = 'var(--bg-color)';
                }

                pasoActual++;
                setTimeout(parpadear, tiempoActual);
            }

            parpadear();
        }

        inicializar();
    </script>
</body>
</html>
