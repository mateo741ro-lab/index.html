<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070d0a">

  <title>Campeonato Fútbol 5</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070d0a;
      --panel: #0e1712;
      --panel2: #132019;
      --line: rgba(255,255,255,.08);

      --verde: #19d489;
      --verde-suave: rgba(25,212,137,.14);
      --verde-osc: #0b3d2e;

      --oro: #ffce3d;
      --rojo: #ff5a5f;

      --txt: #eef6f2;
      --mut: #8fa9a0;

      --radio: 20px;
      --sombra: 0 18px 50px rgba(0,0,0,.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(25,212,137,.10), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(255,206,61,.06), transparent 25%),
        var(--bg);
      color: var(--txt);
      min-height: 100vh;
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(7,13,10,.82);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .logo-ball {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      display: grid;
      place-items: center;

      background:
        radial-gradient(circle at 35% 30%, white 0 7%, transparent 8%),
        linear-gradient(145deg, #fff, #b9c5bf);

      color: #101714;
      font-size: 22px;
      box-shadow: 0 0 25px rgba(25,212,137,.18);
    }

    .logo-text strong {
      display: block;
      font-family: Sora, sans-serif;
      font-size: 15px;
      letter-spacing: .4px;
    }

    .logo-text span {
      color: var(--verde);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    nav {
      display: flex;
      gap: 5px;
    }

    nav button {
      border: 0;
      color: var(--mut);
      background: transparent;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      transition: .25s;
    }

    nav button:hover,
    nav button.active {
      color: var(--txt);
      background: rgba(255,255,255,.06);
    }

    .header-cta {
      border: 0;
      color: #08100c;
      font-weight: 800;
      padding: 11px 16px;
      border-radius: 12px;

      background: linear-gradient(135deg, var(--oro), #ffe98a);
      box-shadow: 0 8px 25px rgba(255,206,61,.15);
      transition: .25s;
    }

    .header-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255,206,61,.25);
    }

    /* =========================
       VIEWS
    ========================== */

    .view {
      display: none;
      animation: aparecer .4s ease;
    }

    .view.active {
      display: block;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 610px;
      position: relative;
      overflow: hidden;

      display: flex;
      align-items: center;

      background:
        linear-gradient(90deg, rgba(4,10,7,.98), rgba(4,10,7,.73), rgba(4,10,7,.55)),
        url("https://images.unsplash.com/photo-1529900748604-07564a03e7a6?auto=format&fit=crop&w=1800&q=85")
        center/cover;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background:
        repeating-linear-gradient(
          -45deg,
          transparent 0 20px,
          rgba(25,212,137,.035) 20px 22px
        );
    }

    .hero-content {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 80px 20px;
      position: relative;
      z-index: 2;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 12px;
      border: 1px solid rgba(25,212,137,.25);
      border-radius: 999px;

      color: var(--verde);
      background: rgba(25,212,137,.08);

      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: var(--verde);
      border-radius: 50%;
      animation: pulso 1.6s infinite;
    }

    @keyframes pulso {
      0%,100% {
        box-shadow: 0 0 0 0 rgba(25,212,137,.4);
      }

      50% {
        box-shadow: 0 0 0 9px rgba(25,212,137,0);
      }
    }

    .hero h1 {
      max-width: 760px;
      margin-top: 20px;

      font-family: Sora, sans-serif;
      font-size: clamp(42px, 7vw, 82px);
      line-height: .98;
      letter-spacing: -3px;
    }

    .hero h1 span {
      color: var(--verde);
    }

    .hero p {
      max-width: 620px;
      margin-top: 24px;

      color: #bdccc6;
      font-size: 17px;
      line-height: 1.7;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      border: 0;
      padding: 14px 20px;
      border-radius: 13px;
      font-weight: 800;
      transition: .25s;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      color: #07100b;
      background: linear-gradient(135deg, var(--verde), #77f0be);
      box-shadow: 0 12px 30px rgba(25,212,137,.18);
    }

    .btn-gold {
      color: #171000;
      background: linear-gradient(135deg, var(--oro), #ffe98a);
    }

    .btn-dark {
      color: var(--txt);
      background: rgba(255,255,255,.06);
      border: 1px solid var(--line);
    }

    .floating-ball {
      position: absolute;
      right: 8%;
      bottom: 16%;
      z-index: 3;

      width: 95px;
      height: 95px;
      border-radius: 50%;

      display: grid;
      place-items: center;

      font-size: 55px;

      background: rgba(255,255,255,.92);
      box-shadow:
        0 0 60px rgba(25,212,137,.2),
        0 20px 40px rgba(0,0,0,.4);

      animation: flotar 4s ease-in-out infinite;
    }

    @keyframes flotar {
      0%,100% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-22px) rotate(8deg);
      }
    }

    /* =========================
       MARQUEE
    ========================== */

    .marquee {
      overflow: hidden;
      white-space: nowrap;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #0a120e;
    }

    .marquee-track {
      display: inline-block;
      padding: 14px 0;
      animation: desfile 25s linear infinite;
    }

    .marquee span {
      margin: 0 30px;
      color: var(--mut);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .marquee strong {
      color: var(--verde);
    }

    @keyframes desfile {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    /* =========================
       GENERAL
    ========================== */

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 70px 20px;
    }

    .section-title {
      margin-bottom: 35px;
    }

    .section-title small {
      color: var(--verde);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .section-title h2 {
      margin-top: 8px;
      font-family: Sora, sans-serif;
      font-size: clamp(28px, 5vw, 44px);
    }

    .section-title p {
      max-width: 650px;
      color: var(--mut);
      margin-top: 10px;
      line-height: 1.6;
    }

    /* =========================
       CARDS
    ========================== */

    .cards {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 18px;
    }

    .card {
      position: relative;
      overflow: hidden;

      padding: 25px;
      background: linear-gradient(145deg, rgba(19,32,25,.95), rgba(10,18,14,.95));

      border: 1px solid var(--line);
      border-radius: var(--radio);

      box-shadow: var(--sombra);

      transition: .3s;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 2px;

      background: linear-gradient(90deg, transparent, var(--verde), transparent);
      opacity: .6;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(25,212,137,.25);
    }

    .card-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;

      border-radius: 14px;
      background: var(--verde-suave);
      font-size: 22px;
      margin-bottom: 18px;
    }

    .card h3 {
      font-family: Sora, sans-serif;
      font-size: 18px;
      margin-bottom: 9px;
    }

    .card p {
      color: var(--mut);
      line-height: 1.6;
      font-size: 14px;
    }

    /* =========================
       PRIZES
    ========================== */

    .prize {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 20px;
      margin-top: 20px;
    }

    .prize-main {
      padding: 35px;
      border-radius: var(--radio);

      background:
        radial-gradient(circle at 90% 20%, rgba(255,206,61,.15), transparent 30%),
        linear-gradient(135deg,#15170d,#0d1711);

      border: 1px solid rgba(255,206,61,.18);
    }

    .prize-main small {
      color: var(--oro);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .prize-main h3 {
      margin-top: 12px;
      font-family: Sora, sans-serif;
      font-size: 42px;
      color: var(--oro);
    }

    .prize-main p {
      color: var(--mut);
      margin-top: 10px;
    }

    .stat-box {
      padding: 28px;
      border-radius: var(--radio);
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .stat-box strong {
      display: block;
      font-family: Sora;
      font-size: 32px;
      color: var(--verde);
    }

    .stat-box span {
      display: block;
      margin-top: 5px;
      color: var(--mut);
      font-size: 13px;
    }

    /* =========================
       FORM
    ========================== */

    .form-card {
      max-width: 850px;
      margin: auto;

      padding: 30px;
      border-radius: var(--radio);

      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--sombra);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1/-1;
    }

    label {
      color: #c8d5d0;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;

      padding: 13px 14px;

      color: var(--txt);
      background: #09110d;

      border: 1px solid var(--line);
      border-radius: 11px;

      outline: none;
      transition: .2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(25,212,137,.55);
      box-shadow: 0 0 0 3px rgba(25,212,137,.07);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 10px;
    }

    .submit-area {
      margin-top: 25px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .notice {
      color: var(--mut);
      font-size: 12px;
      line-height: 1.5;
    }

    /* =========================
       TEAMS
    ========================== */

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }

    .filters input,
    .filters select {
      max-width: 250px;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 16px;
    }

    .team-card {
      padding: 20px;
      border-radius: 17px;

      background: var(--panel);
      border: 1px solid var(--line);

      transition: .25s;
    }

    .team-card:hover {
      transform: translateY(-4px);
    }

    .team-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .team-logo {
      width: 50px;
      height: 50px;

      border-radius: 14px;
      display: grid;
      place-items: center;

      background: var(--verde-suave);
      font-size: 24px;
    }

    .team-name {
      flex: 1;
    }

    .team-name h3 {
      font-size: 16px;
      font-family: Sora;
    }

    .team-name span {
      color: var(--mut);
      font-size: 12px;
    }

    .status {
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
    }

    .paid {
      color: var(--verde);
      background: var(--verde-suave);
    }

    .pending {
      color: var(--oro);
      background: rgba(255,206,61,.1);
    }

    .team-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }

    .info {
      padding: 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.035);
    }

    .info small {
      color: var(--mut);
      display: block;
      font-size: 10px;
    }

    .info strong {
      font-size: 12px;
    }

    /* =========================
       INFO
    ========================== */

    .info-list {
      display: grid;
      gap: 12px;
      max-width: 850px;
    }

    .info-row {
      display: flex;
      gap: 15px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--panel);
    }

    .info-row .number {
      width: 35px;
      height: 35px;
      flex: 0 0 35px;

      display: grid;
      place-items: center;

      border-radius: 10px;
      color: #06100b;
      background: var(--verde);
      font-weight: 900;
    }

    .info-row h3 {
      margin-bottom: 5px;
      font-size: 15px;
    }

    .info-row p {
      color: var(--mut);
      line-height: 1.5;
      font-size: 13px;
    }

    /* =========================
       CONTACT
    ========================== */

    .contact-box {
      max-width: 800px;
      margin: auto;
      text-align: center;
      padding: 50px 25px;

      border-radius: 25px;

      background:
        radial-gradient(circle at 50% 0%, rgba(25,212,137,.14), transparent 40%),
        var(--panel);

      border: 1px solid var(--line);
    }

    .contact-box h2 {
      font-family: Sora;
      font-size: 34px;
    }

    .contact-box p {
      color: var(--mut);
      max-width: 550px;
      margin: 12px auto 25px;
      line-height: 1.6;
    }

    .contact-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* =========================
       CONFIRMATION
    ========================== */

    .confirmation {
      max-width: 700px;
      margin: 80px auto;
      padding: 45px 25px;
      text-align: center;

      background: var(--panel);
      border: 1px solid rgba(25,212,137,.25);
      border-radius: 25px;
      box-shadow: var(--sombra);
    }

    .success-icon {
      width: 75px;
      height: 75px;
      margin: auto;

      display: grid;
      place-items: center;

      border-radius: 50%;
      background: var(--verde-suave);
      color: var(--verde);
      font-size: 36px;
    }

    .confirmation h2 {
      font-family: Sora;
      margin-top: 20px;
      font-size: 32px;
    }

    .confirmation p {
      color: var(--mut);
      line-height: 1.6;
      margin: 12px auto 25px;
    }

    /* =========================
       ADMIN
    ========================== */

    .admin-login {
      max-width: 450px;
      margin: 70px auto;
      padding: 30px;

      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
    }

    .admin-dashboard {
      display: none;
    }

    .admin-dashboard.active {
      display: block;
    }

    .admin-stats {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .admin-stat {
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 15px;
    }

    .admin-stat strong {
      display: block;
      font-family: Sora;
      font-size: 25px;
      color: var(--verde);
    }

    .admin-stat span {
      color: var(--mut);
      font-size: 12px;
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
      margin-top: 50px;
      padding: 35px 20px 90px;

      border-top: 1px solid var(--line);
      text-align: center;

      color: var(--mut);
      font-size: 12px;
    }

    footer strong {
      color: var(--verde);
    }

    /* =========================
       MOBILE NAV
    ========================== */

    .mobile-nav {
      display: none;

      position: fixed;
      z
