<!<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego - Mando y Receptor</title>
    <!-- Librería PeerJS para conexión directa (WebRTC) sin backend -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Librería QRious para generar el código QR en el celular emisor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --btn-a: #ff4757; /* Rojo */
            --btn-b: #1e90ff; /* Azul */
            --btn-c: #2ed573; /* Verde */
            --btn-d: #ffa502; /* Amarillo */
        }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; text-align: center;
            transition: background-color 0.1s; /* Para el destello visual en iOS */
        }
        h1 { margin-top: 30px; font-size: 1.5rem; }
        
        /* Estado de conexión */
        .status-badge {
            margin-bottom: 20px; padding: 8px 20px; border-radius: 20px;
            font-weight: bold; background: #333; font-size: 0.9rem;
        }
        .status-badge.connected { background: var(--btn-c); color: #000; }
        .status-badge.error { background: var(--btn-a); color: #fff; }

        /* Contenedores de pantallas */
        #emisor-screen, #receptor-screen, #loading-screen {
            display: none; width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box;
        }

        /* DISEÑO EMISOR */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .btn-signal {
            border: none; border-radius: 15px; padding: 40px 0;
            font-size: 2rem; font-weight: bold; color: white;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-signal:active { transform: scale(0.92); }
        .btn-signal:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-a { background-color: var(--btn-a); }
        .btn-b { background-color: var(--btn-b); }
        .btn-c { background-color: var(--btn-c); color: #000; }
        .btn-d { background-color: var(--btn-d); color: #000; }

        #qr-section { margin-top: 30px; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; }
        #qr-canvas { background: white; padding: 10px; border-radius: 10px; }
        .help-text { font-size: 0.85rem; color: #aaa; margin-top: 10px; }

        /* DISEÑO RECEPTOR */
        #last-signal {
            font-size: 6rem; font-weight: bold; margin: 40px 0;
            min-height: 140px; display: flex; align-items: center; justify-content: center;
        }
        .btn-test {
            background: #333; color: white; border: none; padding: 15px 30px;
            font-size: 1.1rem; border-radius: 10px; cursor: pointer; width: 100%;
            margin-top: 20px;
        }
        .btn-test:active { background: #555; }
    </style>
</head>
<body>

    <h1 id="main-title">Iniciando...</h1>
    <div id="status" class="status-badge">Conectando al servidor...</div>

    <!-- PANTALLA EMISOR -->
    <div id="emisor-screen">
        <div class="btn-grid">
            <button class="btn-signal btn-a" onclick="enviarSenal('A')" disabled>A</button>
            <button class="btn-signal btn-b" onclick="enviarSenal('B')" disabled>B</button>
            <button class="btn-signal btn-c" onclick="enviarSenal('C')" disabled>C</button>
            <button class="btn-signal btn-d" onclick="enviarSenal('D')" disabled>D</button>
        </div>
        
        <div id="qr-section">
            <p>Escanea este QR con el otro celular para conectarlo (Receptor)</p>
            <canvas id="qr-canvas"></canvas>
            <p class="help-text">Mantén esta pantalla abierta.</p>
        </div>
    </div>

    <!-- PANTALLA RECEPTOR -->
    <div id="receptor-screen">
        <p>Última señal recibida:</p>
        <div id="last-signal">-</div>
        <button class="btn-test" onclick="probarVibracion()">Probar Vibración (A)</button>
    </div>

    <script>
        // Variables globales
        let peer;
        let conexion;
        const urlParams = new URLSearchParams(window.location.search);
        const receptorModeId = urlParams.get('join'); // Si la URL tiene ?join=ID, este celular es RECEPTOR
        
        const UI = {
            status: document.getElementById('status'),
            title: document.getElementById('main-title'),
            emisorScreen: document.getElementById('emisor-screen'),
            receptorScreen: document.getElementById('receptor-screen'),
            qrSection: document.getElementById('qr-section'),
            botones: document.querySelectorAll('.btn-signal'),
            lastSignal: document.getElementById('last-signal')
        };

        // Función para actualizar el estado visual
        function setStatus(text, isConnected = false, isError = false) {
            UI.status.innerText = text;
            UI.status.className = 'status-badge';
            if (isConnected) UI.status.classList.add('connected');
            if (isError) UI.status.classList.add('error');
        }

        // Inicializar PeerJS
        function inicializar() {
            peer = new Peer(); // Se conecta al servidor gratuito de PeerJS

            peer.on('open', (id) => {
                if (receptorModeId) {
                    iniciarReceptor(id);
                } else {
                    iniciarEmisor(id);
                }
            });

            peer.on('error', (err) => {
                setStatus('Error de conexión', false, true);
                console.error(err);
            });
        }

        // --- LÓGICA DEL EMISOR ---
        function iniciarEmisor(myId) {
            UI.title.innerText = "Modo: EMISOR";
            UI.emisorScreen.style.display = 'block';
            setStatus('Esperando al receptor...');

            // Generar enlace para el receptor
            const joinUrl = window.location.href.split('?')[0] + '?join=' + myId;
            
            // Generar código QR
            new QRious({
                element: document.getElementById('qr-canvas'),
                value: joinUrl,
                size: 200
            });

            // Escuchar conexiones entrantes del receptor
            peer.on('connection', (conn) => {
                conexion = conn;
                UI.qrSection.style.display = 'none'; // Ocultar QR cuando se conecta
                setStatus('Conectado', true);
                
                // Habilitar botones
                UI.botones.forEach(btn => btn.disabled = false);

                conexion.on('close', () => {
                    setStatus('Desconectado. Recarga la página.', false, true);
                    UI.botones.forEach(btn => btn.disabled = true);
                });
            });
        }

        function enviarSenal(letra) {
            if (conexion && conexion.open) {
                conexion.send({ signal: letra });
            }
        }

        // --- LÓGICA DEL RECEPTOR ---
        function iniciarReceptor(myId) {
            UI.title.innerText = "Modo: RECEPTOR";
            UI.receptorScreen.style.display = 'block';
            setStatus('Conectando al Emisor...');

            // Conectar con el ID del emisor obtenido de la URL
            conexion = peer.connect(receptorModeId);

            conexion.on('open', () => {
                setStatus('Conectado', true);
            });

            conexion.on('data', (data) => {
                if (data.signal) {
                    recibirSenal(data.signal);
                }
            });

            conexion.on('close', () => {
                setStatus('Emisor desconectado', false, true);
            });
        }

        function recibirSenal(letra) {
            UI.lastSignal.innerText = letra;
            UI.lastSignal.style.color = getComputedStyle(document.body).getPropertyValue('--btn-' + letra.toLowerCase());
            
            // Configurar patrón de vibración y flash visual (para iOS)
            let vibPattern = [];
            let flashCount = 0;

            if (letra === 'A') { vibPattern = [200]; flashCount = 1; }
            if (letra === 'B') { vibPattern = [200, 200, 200]; flashCount = 2; }
            if (letra === 'C') { vibPattern = [200, 200, 200, 200, 200]; flashCount = 3; }
            if (letra === 'D') { vibPattern = [200, 200, 200, 200, 200, 200, 200]; flashCount = 4; }

            // Intentar vibrar (Android)
            if (navigator.vibrate) {
                navigator.vibrate(vibPattern);
            }

            // Destello visual (Alternativa para iOS y refuerzo visual)
            ejecutarDestello(flashCount);
        }

        function probarVibracion() {
            recibirSenal('A');
        }

        function ejecutarDestello(veces) {
            let count = 0;
            const intervalo = setInterval(() => {
                document.body.style.backgroundColor = (document.body.style.backgroundColor === 'white') ? 'var(--bg-color)' : 'white';
                count++;
                if (count >= veces * 2) {
                    clearInterval(intervalo);
                    document.body.style.backgroundColor = 'var(--bg-color)';
                }
            }, 200); // 200ms por cada cambio de luz
        }

        // Arrancar la aplicación
        inicializar();
    </script>
</body>
</html>
