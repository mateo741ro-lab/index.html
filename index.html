<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truco Communicator PeerJS</title>
    <!-- PeerJS para conexión P2P -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- QRCode.js para generación de código QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #09090b;
            --card-bg: #18181b;
            --border: #27272a;
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --danger: #ef4444;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header { text-align: center; padding: 10px 0; }
        header h1 { font-size: 1.5rem; font-weight: 700; }
        header p { font-size: 0.85rem; color: var(--text-muted); }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn:active { transform: scale(0.97); }
        .btn-primary { background-color: var(--primary); color: #000; }
        .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background-color: var(--danger); color: #fff; }

        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .grid-btn {
            background: #27272a;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px 10px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }

        .grid-btn:active {
            background: var(--primary);
            color: #000;
        }

        #qrcode {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: #27272a;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .status-badge.connected {
            background: rgba(34, 197, 94, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            text-align: center;
            letter-spacing: 2px;
        }

        /* Pantalla de sigilo (Modo Bolsillo) */
        #stealth-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            color: #222;
        }

        #stealth-screen.active {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Truco Communicator</h1>
            <p>Conexión táctil P2P por Vibración</p>
        </header>

        <!-- Selector de Rol -->
        <div id="role-selector" class="card">
            <h3>Seleccionar Modo</h3>
            <button class="btn btn-primary" onclick="setRole('receiver')">📱 Teléfono Bolsillo (Receptor)</button>
            <button class="btn btn-outline" onclick="setRole('sender')">🎮 Teléfono Control (Emisor)</button>
        </div>

        <!-- MODO RECEPTOR (BOLSILLO) -->
        <div id="receiver-panel" class="card" style="display: none;">
            <div id="receiver-status" class="status-badge">Esperando conexión...</div>
            <p style="font-size: 0.85rem; text-align: center; color: var(--text-muted);">
                Escaneá este código QR con el teléfono control o ingresá la clave.
            </p>
            <div id="qrcode"></div>
            <p style="font-size: 0.9rem; font-weight: bold;">ID: <span id="peer-id-display">Cargando...</span></p>
            
            <button class="btn btn-primary" onclick="activarModoBolsillo()">👁️ Activar Modo Bolsillo (Pantalla Negra)</button>
        </div>

        <!-- MODO EMISOR (CONTROL) -->
        <div id="sender-panel" class="card" style="display: none;">
            <div id="sender-status" class="status-badge">Desconectado</div>
            <div id="connect-form" style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
                <input type="text" id="target-id" placeholder="Ingresar ID del Receptor" autocomplete="off">
                <button class="btn btn-primary" onclick="conectarAEmisor()">Conectar</button>
            </div>

            <!-- Botonera táctil de señales -->
            <div id="controls" class="grid-buttons" style="display: none;">
                <button class="grid-btn" onclick="enviarVibracion('envido')">1. Envido<br><small>(1 Corto)</small></button>
                <button class="grid-btn" onclick="enviarVibracion('real_envido')">2. Real Envido<br><small>(2 Cortos)</small></button>
                <button class="grid-btn" onclick="enviarVibracion('falta_envido')">3. Falta Envido<br><small>(1 Largo)</small></button>
                <button class="grid-btn" onclick="enviarVibracion('truco')">4. Truco<br><small>(3 Cortos)</small></button>
                <button class="grid-btn" onclick="enviarVibracion('re_truco')">5. Re Truco<br><small>(1 Largo + 1 Corto)</small></button>
                <button class="grid-btn" onclick="enviarVibracion('vale_cuatro')">6. Vale 4<br><small>(2 Largos)</small></button>
                <button class="grid-btn" onclick="enviarVibracion('quiero')">7. Quiero<br><small>(Doble pulso rápido)</small></button>
                <button class="grid-btn" style="background: #ef4444;" onclick="enviarVibracion('no_quiero')">8. No Quiero<br><small>(1 Continuo)</small></button>
            </div>
        </div>
    </div>

    <!-- Pantalla negra para receptor -->
    <div id="stealth-screen" onclick="desactivarModoBolsillo()">
        <p style="font-size: 0.7rem; color: #222;">Toca 2 veces para salir</p>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let wakeLock = null;

        // Patrones de vibración en milisegundos [vibrar, pausar, vibrar...]
        const patrones = {
            envido: [200],
            real_envido: [200, 150, 200],
            falta_envido: [800],
            truco: [150, 100, 150, 100, 150],
            re_truco: [600, 150, 200],
            vale_cuatro: [600, 200, 600],
            quiero: [100, 50, 100],
            no_quiero: [1200]
        };

        // Comprobar parámetros en URL por si se escaneó un QR
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const connectId = urlParams.get('connect');
            if (connectId) {
                setRole('sender');
                document.getElementById('target-id').value = connectId;
                conectarAEmisor();
            }
        });

        function setRole(role) {
            document.getElementById('role-selector').style.display = 'none';
            if (role === 'receiver') {
                document.getElementById('receiver-panel').style.display = 'flex';
                iniciarReceptor();
            } else {
                document.getElementById('sender-panel').style.display = 'flex';
                iniciarEmisor();
            }
        }

        // --- LÓGICA DEL RECEPTOR (BOLSILLO) ---
        function iniciarReceptor() {
            peer = new Peer();

            peer.on('open', (id) => {
                document.getElementById('peer-id-display').innerText = id;
                
                // Generar código QR con la URL de conexión directa
                const directUrl = `${window.location.origin}${window.location.pathname}?connect=${id}`;
                new QRCode(document.getElementById("qrcode"), {
                    text: directUrl,
                    width: 160,
                    height: 160
                });
            });

            peer.on('connection', (connection) => {
                conn = connection;
                actualizarEstado('receiver-status', '🎮 Control Conectado', true);
                
                conn.on('data', (cmd) => {
                    ejecutarVibracion(cmd);
                });

                conn.on('close', () => {
                    actualizarEstado('receiver-status', 'Control Desconectado', false);
                });
            });
        }

        function ejecutarVibracion(comando) {
            if (patrones[comando] && 'vibrate' in navigator) {
                navigator.vibrate(patrones[comando]);
            }
        }

        // --- LÓGICA DEL EMISOR (CONTROL) ---
        function iniciarEmisor() {
            peer = new Peer();
        }

        function conectarAEmisor() {
            const targetId = document.getElementById('target-id').value.trim();
            if (!targetId) return;

            actualizarEstado('sender-status', 'Conectando...', false);
            conn = peer.connect(targetId);

            conn.on('open', () => {
                actualizarEstado('sender-status', '📱 Conectado al Bolsillo', true);
                document.getElementById('connect-form').style.display = 'none';
                document.getElementById('controls').style.display = 'grid';
            });

            conn.on('close', () => {
                actualizarEstado('sender-status', 'Conexión perdida', false);
                document.getElementById('connect-form').style.display = 'flex';
                document.getElementById('controls').style.display = 'none';
            });
        }

        function enviarVibracion(tipo) {
            if (conn && conn.open) {
                conn.send(tipo);
                // Vibración háptica local de confirmación corta
                if ('vibrate' in navigator) navigator.vibrate(40);
            }
        }

        function actualizarEstado(elementId, texto, conectado) {
            const el = document.getElementById(elementId);
            el.innerText = texto;
            if (conectado) el.classList.add('connected');
            else el.classList.remove('connected');
        }

        // --- MODO BOLSILLO Y WAKE LOCK ---
        async function activarModoBolsillo() {
            document.getElementById('stealth-screen').classList.add('active');
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
        }

        function desactivarModoBolsillo() {
            document.getElementById('stealth-screen').classList.remove('active');
            if (wakeLock) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }
    </script>
</body>
</html>
