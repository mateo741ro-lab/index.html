<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truco - Modo Espía</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg-color: #121212; --text-color: #ffffff; --accent-color: #4CAF50; }
        body {
            margin: 0; padding: 0; font-family: sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; text-align: center;
            -webkit-tap-highlight-color: transparent;
        }
        h1 { margin-top: 15px; font-size: 1.2rem; color: #aaa;}
        .top-controls { display: flex; gap: 10px; margin-bottom: 15px; width: 100%; max-width: 400px; justify-content: center; padding: 0 10px; box-sizing: border-box; }
        .status-badge { padding: 8px 15px; border-radius: 10px; font-weight: bold; background: #333; font-size: 0.8rem; flex-grow: 1; }
        .btn-stealth { background: #2a2a2a; border: 1px solid #555; color: white; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #active-screen { width: 100%; max-width: 400px; padding: 10px; box-sizing: border-box; }
        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        
        .btn-carta {
            border: none; border-radius: 15px; padding: 18px 5px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; background: #1e1e1e; border: 1px solid #333;
        }
        .btn-carta:active { background: #333; }
        .icono { font-size: 2.2rem; margin-bottom: 2px; pointer-events: none; }
        .nombre { font-size: 1rem; font-weight: bold; color: #ddd; margin-bottom: 2px; pointer-events: none;}
        
        /* Debug consola en pantalla */
        #debug-log { margin-top: 20px; font-size: 0.8rem; color: #ff5555; max-width: 90%; text-align: left; }
    </style>
</head>
<body>

    <h1 id="main-title">Prueba de Vibración Directa</h1>
    
    <div class="top-controls">
        <div id="status" class="status-badge">Modo Diagnóstico</div>
    </div>

    <div id="active-screen">
        <div class="btn-grid" id="button-container">
            <!-- Botones generados acá -->
        </div>
        <div id="debug-log"></div>
    </div>

    <script>
        const SENAS = {
            'MACHO': { nombre: '1 Espada', icono: '♠️', patron: [700] },
            'HEMBRA': { nombre: '1 Basto', icono: '🪵', patron: [400, 200, 400] },
            '7ESPADA': { nombre: '7 Espada', icono: '⚔️', patron: [150, 100, 150, 100, 150] },
            '7ORO': { nombre: '7 Oro', icono: '🪙', patron: [100, 80, 100, 80, 100, 80, 100] }
        };

        const btnContainer = document.getElementById('button-container');
        const debugLog = document.getElementById('debug-log');

        for (const [clave, datos] of Object.entries(SENAS)) {
            const btn = document.createElement('button');
            btn.className = 'btn-carta';
            btn.innerHTML = `<span class="icono">${datos.icono}</span><span class="nombre">${datos.nombre}</span>`;
            
            // Usamos un listener directo y nativo
            btn.addEventListener('click', function() {
                ejecutarVibracion(datos.patron, datos.nombre);
            });
            
            btnContainer.appendChild(btn);
        }

        function ejecutarVibracion(patron, nombre) {
            if ("vibrate" in navigator) {
                // El navegador devuelve TRUE si vibró, o FALSE si lo bloqueó
                let funciono = navigator.vibrate(patron);
                
                if (!funciono) {
                    debugLog.innerHTML = `⚠️ <b>Chrome bloqueó la vibración para "${nombre}".</b><br><br>
                    Posibles causas:<br>
                    1. Tenés el "Ahorro de batería" activado (apagalo).<br>
                    2. Abriste el link desde WhatsApp/Instagram (Tocá los 3 puntitos y poné "Abrir en Chrome").<br>
                    3. Tiiny.host está bloqueando los permisos (probá subirlo a GitHub Pages o abrir el archivo HTML directo en el celu).`;
                } else {
                    debugLog.innerHTML = `✅ Vibrando: ${nombre}`;
                }
            } else {
                debugLog.innerHTML = `❌ Tu navegador no soporta vibración web.`;
            }

            // Destello visual
            document.body.style.backgroundColor = '#333';
            setTimeout(() => { document.body.style.backgroundColor = 'var(--bg-color)'; }, 150);
        }
    </script>
</body>
</html>
