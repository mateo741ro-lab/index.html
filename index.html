<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker de Circuito GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            margin: 0;
            overflow-x: hidden;
        }

        .track-widget {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 120px;
            height: 120px;
            z-index: 50;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 1rem;
            padding: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            transition: transform 0.3s ease;
        }

        @media (min-width: 768px) {
            .track-widget {
                width: 180px;
                height: 180px;
                top: 2rem;
                right: 2rem;
            }
        }

        #track-progress {
            transition: stroke-dashoffset 1s linear;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid #334155;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="track-widget flex flex-col items-center justify-center">
        <span class="text-xs font-semibold text-slate-400 mb-1" id="widget-status">Progreso: 0%</span>
        <svg viewBox="0 0 200 150" class="w-full h-full drop-shadow-lg">
            <!-- Circuito de fondo (Gris) -->
            <!-- Usamos un path que simula un circuito estilo Fórmula 1 con curvas y rectas -->
            <path id="track-bg" 
                  d="M 50 120 C 10 120, 10 30, 50 30 L 100 30 C 130 30, 130 60, 150 60 C 170 60, 190 80, 180 110 C 170 140, 130 120, 100 120 Z" 
                  stroke="#334155" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Circuito de progreso (Rojo) -->
            <path id="track-progress" 
                  d="M 50 120 C 10 120, 10 30, 50 30 L 100 30 C 130 30, 130 60, 150 60 C 170 60, 190 80, 180 110 C 170 140, 130 120, 100 120 Z" 
                  stroke="#ef4444" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <main class="w-full max-w-md mt-20 md:mt-0 z-10 relative">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-400 mb-2">
                SpeedTrack
            </h1>
            <p class="text-slate-400 text-sm">Tu circuito personal GPS</p>
        </div>

        <div class="glass-panel rounded-2xl p-6 shadow-2xl">
            
            <!-- Input de distancia -->
            <div class="mb-6">
                <label for="target-distance" class="block text-sm font-medium text-slate-300 mb-2">
                    Distancia Objetivo (Kilómetros)
                </label>
                <input type="number" id="target-distance" min="0.1" step="0.1" value="1.0" 
                       class="w-full bg-slate-800 border border-slate-600 rounded-lg py-3 px-4 text-white font-bold text-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-colors"
                       placeholder="Ej: 1.5">
            </div>

            <!-- Estadísticas -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-slate-800/50 rounded-xl p-4 text-center border border-slate-700">
                    <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Recorrido</p>
                    <p class="text-2xl font-bold text-white"><span id="current-distance">0.00</span> <span class="text-sm font-normal text-slate-400">km</span></p>
                </div>
                <div class="bg-slate-800/50 rounded-xl p-4 text-center border border-slate-700">
                    <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Restante</p>
                    <p class="text-2xl font-bold text-white"><span id="remaining-distance">0.00</span> <span class="text-sm font-normal text-slate-400">km</span></p>
                </div>
            </div>

            <!-- Estado de GPS -->
            <div id="status-message" class="text-center text-sm font-medium text-slate-400 mb-4 h-5">
                Listo para comenzar
            </div>

            <!-- Botones de Acción -->
            <div class="flex gap-4">
                <button id="btn-start" class="flex-1 bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-red-500/30 transform transition hover:-translate-y-1 active:translate-y-0">
                    Iniciar
                </button>
                <button id="btn-stop" disabled class="flex-1 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none text-white font-bold py-4 px-6 rounded-xl transition transform hover:-translate-y-1 active:translate-y-0">
                    Detener
                </button>
            </div>
        </div>
    </main>

    <script>
        const trackProgress = document.getElementById('track-progress');
        const widgetStatus = document.getElementById('widget-status');
        const inputTargetDistance = document.getElementById('target-distance');
        const displayCurrentDistance = document.getElementById('current-distance');
        const displayRemainingDistance = document.getElementById('remaining-distance');
        const statusMessage = document.getElementById('status-message');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');

        let watchId = null;
        let lastPosition = null;
        let accumulatedDistanceKm = 0;
        let targetDistanceKm = 1.0;
        let isTracking = false;

        // Configurar longitud del path SVG para la animación de dashoffset
        const pathLength = trackProgress.getTotalLength();
        trackProgress.style.strokeDasharray = pathLength;
        trackProgress.style.strokeDashoffset = pathLength; // Oculto al inicio (0%)

        // Convertir grados a radianes
        function deg2rad(deg) {
            return deg * (Math.PI / 180);
        }

        // Fórmula de Haversine para calcular distancia en kilómetros entre dos coordenadas GPS
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radio de la Tierra en km
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // Distancia en km
        }

        function updateUI() {
            // Limitar a máximo 100% de progreso
            const progressRatio = Math.min(accumulatedDistanceKm / targetDistanceKm, 1);
            const percentage = (progressRatio * 100).toFixed(1);
            
            // Actualizar textos
            displayCurrentDistance.innerText = accumulatedDistanceKm.toFixed(3);
            const remaining = Math.max(targetDistanceKm - accumulatedDistanceKm, 0);
            displayRemainingDistance.innerText = remaining.toFixed(3);
            widgetStatus.innerText = `Progreso: ${percentage}%`;

            // Actualizar SVG stroke (animación de circuito)
            // Cuando progressRatio es 0, offset = pathLength. Cuando es 1, offset = 0.
            const dashoffset = pathLength - (progressRatio * pathLength);
            trackProgress.style.strokeDashoffset = dashoffset;

            if (progressRatio >= 1 && isTracking) {
                statusMessage.innerText = "¡Meta Alcanzada! 🎉";
                statusMessage.classList.add("text-green-400");
                statusMessage.classList.remove("text-yellow-400");
                stopTracking();
            }
        }

        function handlePositionUpdate(position) {
            const { latitude, longitude, accuracy } = position.coords;

            // Ignorar lecturas extremadamente imprecisas (más de 50 metros de margen)
            // En un entorno de simulación o navegador a veces la precisión es baja, 
            // pero para una app real esto evita saltos falsos.
            if (accuracy > 50 && lastPosition !== null) {
                console.warn("Se ignoró un punto de GPS por baja precisión: " + accuracy + "m");
                return;
            }

            if (lastPosition !== null) {
                const distanceDelta = calculateDistance(
                    lastPosition.latitude, lastPosition.longitude,
                    latitude, longitude
                );
                accumulatedDistanceKm += distanceDelta;
            }

            lastPosition = { latitude, longitude };
            statusMessage.innerText = "📍 Rastreando en vivo...";
            statusMessage.classList.add("text-green-400");
            statusMessage.classList.remove("text-yellow-400");
            
            updateUI();
        }

        function handlePositionError(error) {
            console.error("Error GPS:", error);
            statusMessage.innerText = "⚠️ Error obteniendo señal GPS.";
            statusMessage.className = "text-center text-sm font-medium text-red-500 mb-4 h-5";
        }

        function startTracking() {
            if (!navigator.geolocation) {
                alert("Tu navegador no soporta geolocalización GPS.");
                return;
            }

            // Validar input
            const inputVal = parseFloat(inputTargetDistance.value);
            if (isNaN(inputVal) || inputVal <= 0) {
                alert("Por favor ingresa una distancia válida mayor a 0.");
                return;
            }
            
            targetDistanceKm = inputVal;
            accumulatedDistanceKm = 0;
            lastPosition = null;
            isTracking = true;

            // Bloquear input
            inputTargetDistance.disabled = true;
            inputTargetDistance.classList.add("opacity-50");
            
            // UI Estados de botones
            btnStart.disabled = true;
            btnStop.disabled = false;
            
            statusMessage.innerText = "Buscando señal GPS...";
            statusMessage.className = "text-center text-sm font-medium text-yellow-400 mb-4 h-5";
            
            updateUI(); // Reset UI to 0

            // Iniciar Watch
            const options = {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000
            };
            
            watchId = navigator.geolocation.watchPosition(
                handlePositionUpdate, 
                handlePositionError, 
                options
            );
        }

        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            isTracking = false;
            
            inputTargetDistance.disabled = false;
            inputTargetDistance.classList.remove("opacity-50");
            
            btnStart.disabled = false;
            btnStop.disabled = true;

            if(accumulatedDistanceKm < targetDistanceKm) {
                statusMessage.innerText = "⏸️ Recorrido pausado/detenido.";
                statusMessage.className = "text-center text-sm font-medium text-slate-400 mb-4 h-5";
            }
        }

        btnStart.addEventListener('click', startTracking);
        btnStop.addEventListener('click', stopTracking);
        
        // Actualizar UI inicial con valores base
        updateUI();

    </script>
</body>
</html>
