<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión IA Fútbol</title>
    <!-- Cargamos la IA de Google (TensorFlow.js y el modelo de detección COCO-SSD) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        canvas { border: 2px solid #00ff88; max-width: 100%; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 255, 136, 0.3); }
        video { display: none; } /* Ocultamos el video original, solo mostramos el zoom */
        button { background: #00ff88; color: black; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-bottom: 20px;}
        #status { margin-bottom: 15px; color: #aaa; }
    </style>
</head>
<body>

    <h2>🎥 IA Auto-Tracker de Fútbol</h2>
    <input type="file" id="videoUpload" accept="video/*" style="margin-bottom: 15px;">
    <br>
    <button id="startBtn" disabled>Cargando Cerebro de la IA...</button>
    <div id="status">Espera, descargando modelo de IA (puede tardar 1 min)...</div>

    <!-- El video original (amplio) que la IA mirará -->
    <video id="sourceVideo" controls muted playsinline></video>
    
    <!-- La "Televisión" donde se verá el zoom suave -->
    <canvas id="broadcastCanvas"></canvas>

    <script>
        const video = document.getElementById('sourceVideo');
        const canvas = document.getElementById('broadcastCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const upload = document.getElementById('videoUpload');

        let model;
        // Variables para la cámara suave (Lerp)
        let currentX = 0;
        let currentY = 0;
        const zoomLevel = 0.5; // Muestra el 50% de la cancha (Zoom 2x)
        const smoothness = 0.05; // 0.01 es muy lento, 0.1 es más rápido. 0.05 es suave como TV.

        // Cargar modelo de IA
        cocoSsd.load().then(loadedModel => {
            model = loadedModel;
            startBtn.disabled = false;
            startBtn.innerText = "▶ Iniciar Transmisión IA";
            status.innerText = "IA Lista. Sube un video grabado en gran angular y presiona Iniciar.";
        });

        upload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const url = URL.createObjectURL(file);
            video.src = url;
        });

        startBtn.addEventListener('click', () => {
            if (!video.src) return alert("Sube un video primero.");
            video.play();
            canvas.width = video.videoWidth * zoomLevel;
            canvas.height = video.videoHeight * zoomLevel;
            
            // Iniciar en el centro de la cancha
            currentX = video.videoWidth / 4;
            currentY = video.videoHeight / 4;
            
            startBtn.style.display = 'none';
            status.innerText = "Transmitiendo en vivo...";
            trackAction();
        });

        async function trackAction() {
            if (video.paused || video.ended) return;

            // La IA detecta qué hay en el video
            const predictions = await model.detect(video);
            
            let targetX = currentX;
            let targetY = currentY;
            let validTargets = 0;
            let sumX = 0;
            let sumY = 0;

            // Buscamos la pelota ('sports ball') y los jugadores ('person')
            predictions.forEach(p => {
                if (p.class === 'person' || p.class === 'sports ball') {
                    // Centro del objeto detectado
                    sumX += p.bbox[0] + (p.bbox[2] / 2);
                    sumY += p.bbox[1] + (p.bbox[3] / 2);
                    validTargets++;
                }
            });

            // Si hay jugadores o pelota, calculamos el "centro de la jugada"
            if (validTargets > 0) {
                const centerX = sumX / validTargets;
                const centerY = sumY / validTargets;
                
                // Restamos la mitad del canvas para que la jugada quede en el medio de la pantalla
                targetX = centerX - (canvas.width / 2);
                targetY = centerY - (canvas.height / 2);
            }

            // Evitar que la cámara se salga de los bordes de la cancha (video)
            targetX = Math.max(0, Math.min(targetX, video.videoWidth - canvas.width));
            targetY = Math.max(0, Math.min(targetY, video.videoHeight - canvas.height));

            // LA MAGIA: Movimiento suave (Interpolación Lineal - Lerp)
            currentX += (targetX - currentX) * smoothness;
            currentY += (targetY - currentY) * smoothness;

            // Dibujar el recorte en el canvas (nuestra transmisión)
            ctx.drawImage(video, 
                currentX, currentY, canvas.width, canvas.height, // Qué parte del video original cortamos
                0, 0, canvas.width, canvas.height // Dónde lo pegamos en el canvas
            );

            // Repetir el ciclo infinitamente mientras el video ruede
            requestAnimationFrame(trackAction);
        }
    </script>
</body>
</html>
