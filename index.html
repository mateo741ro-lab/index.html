<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asistente Truco PWA</title>
    <!-- Se incluye OpenCV.js vía CDN para el procesamiento de imágenes -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #00e676;
            --text-color: #e0e0e0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-align: center;
            color: #fff;
        }
        #start-btn {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 25px 30px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 230, 118, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }
        #start-btn:active {
            transform: scale(0.96);
        }
        #start-btn.running {
            background-color: #f44336;
            box-shadow: 0 8px 20px rgba(244, 67, 54, 0.3);
        }
        #status-bar {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #888;
            text-align: center;
            width: 100%;
        }
        #video-container {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            display: none; /* Oculto para ahorrar batería visual, pero activo en DOM */
        }
        video {
            width: 100%;
            display: block;
        }
        canvas {
            display: none; /* Canvas de procesamiento interno */
        }
        #logs {
            background-color: var(--surface-color);
            width: 100%;
            max-width: 400px;
            flex-grow: 1;
            margin-top: 20px;
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.85rem;
            border: 1px solid #333;
            box-sizing: border-box;
        }
        .log-entry {
            margin-bottom: 8px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 6px;
            line-height: 1.3;
        }
        .log-time {
            color: var(--primary-color);
            font-weight: bold;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <h1>Asistente Táctico Truco</h1>
    
    <button id="start-btn">INICIAR ASISTENTE</button>
    
    <div id="status-bar">
        Cámara: <span id="cam-status">Inactiva</span> | WakeLock: <span id="wake-status">Inactivo</span>
    </div>

    <div id="video-container">
        <video id="video" autoplay playsinline></video>
    </div>
    <canvas id="canvas"></canvas>

    <div id="logs">
        <div class="log-entry"><span class="log-time">[SISTEMA]</span> Listo para iniciar. Asegúrate de tener el volumen encendido.</div>
    </div>

    <script>
        // --- VARIABLES GLOBALES ---
        let isRunning = false;
        let wakeLock = null;
        let loopInterval = null;
        let lastSpokenMessage = "";
        let mockIndex = 0; // Solo para simulación

        const btn = document.getElementById('start-btn');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const logsDiv = document.getElementById('logs');
        const camStatus = document.getElementById('cam-status');
        const wakeStatus = document.getElementById('wake-status');

        // --- SISTEMA DE LOGS ---
        function log(message) {
            const time = new Date().toLocaleTimeString('es-ES', { hour12: false });
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            logsDiv.prepend(div);
            // Mantener solo los últimos 50 logs
            if (logsDiv.children.length > 50) {
                logsDiv.removeChild(logsDiv.lastChild);
            }
        }

        // --- TEXT TO SPEECH (VOZ EN ALTO) ---
        function initVoice() {
            // Desbloqueo de audio silencioso requerido por iOS/Android en la primera interacción
            const utterance = new SpeechSynthesisUtterance('');
            utterance.volume = 0;
            window.speechSynthesis.speak(utterance);
        }

        function speak(text) {
            if (text === lastSpokenMessage) return; // Evitar repetir si la mesa no cambia
            
            window.speechSynthesis.cancel(); // Detener locución anterior si hay cola
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES'; // Forzamos español
            utterance.rate = 1.1; // Un poco más rápido para agilidad táctica
            
            window.speechSynthesis.speak(utterance);
            lastSpokenMessage = text;
            log(`🗣️ Diciendo: "${text}"`);
        }

        // --- WAKE LOCK (MANTENER PANTALLA ENCENDIDA) ---
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeStatus.textContent = "Activo";
                    wakeStatus.style.color = "var(--primary-color)";
                    wakeLock.addEventListener('release', () => {
                        wakeStatus.textContent = "Inactivo";
                        wakeStatus.style.color = "#888";
                    });
                } catch (err) {
                    log(`⚠️ Error WakeLock: ${err.name}, ${err.message}`);
                }
            } else {
                log("⚠️ WakeLock no soportado en este navegador.");
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // --- CÁMARA ---
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                
                // Esperar a que el video tenga metadata para setear el canvas
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve();
                    };
                });
                
                camStatus.textContent = "Activa";
                camStatus.style.color = "var(--primary-color)";
                log("📷 Cámara trasera iniciada con éxito.");
            } catch (err) {
                log(`❌ Error al acceder a la cámara: ${err.message}`);
                throw err;
            }
        }

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                camStatus.textContent = "Inactiva";
                camStatus.style.color = "#888";
            }
        }

        // --- LÓGICA DE TRUCO (Cálculo de Envido y Jerarquía) ---
        // Cartas: { numero: int, palo: string ('espada', 'basto', 'oro', 'copa') }
        function analyzeTrucoState(cards) {
            if (!cards || cards.length === 0) return null;

            // 1. Calcular Envido
            let envidoMsg = "";
            let palos = { espada: [], basto: [], oro: [], copa: [] };
            
            cards.forEach(c => {
                let valEnvido = (c.numero < 10) ? c.numero : 0;
                palos[c.palo].push(valEnvido);
            });

            let maxEnvido = 0;
            for (let palo in palos) {
                let valores = palos[palo].sort((a, b) => b - a);
                if (valores.length >= 2) {
                    let envidoActual = 20 + valores[0] + valores[1];
                    if (envidoActual > maxEnvido) maxEnvido = envidoActual;
                } else if (valores.length === 1) {
                    if (valores[0] > maxEnvido) maxEnvido = valores[0];
                }
            }
            if (maxEnvido >= 20) {
                envidoMsg = `Envido, tenés ${maxEnvido}. `;
            } else {
                envidoMsg = `Tenés ${maxEnvido} de envido. `;
            }

            // 2. Calcular mejor carta para el Truco
            const jerarquia = (numero, palo) => {
                if (numero === 1 && palo === 'espada') return 14;
                if (numero === 1 && palo === 'basto') return 13;
                if (numero === 7 && palo === 'espada') return 12;
                if (numero === 7 && palo === 'oro') return 11;
                if (numero === 3) return 10;
                if (numero === 2) return 9;
                if (numero === 1 && (palo === 'copa' || palo === 'oro')) return 8;
                if (numero === 12) return 7;
                if (numero === 11) return 6;
                if (numero === 10) return 5;
                if (numero === 7 && (palo === 'copa' || palo === 'basto')) return 4;
                if (numero === 6) return 3;
                if (numero === 5) return 2;
                if (numero === 4) return 1;
                return 0;
            };

            let mejorCarta = cards[0];
            let maxJerarquia = jerarquia(cards[0].numero, cards[0].palo);

            for (let i = 1; i < cards.length; i++) {
                let j = jerarquia(cards[i].numero, cards[i].palo);
                if (j > maxJerarquia) {
                    maxJerarquia = j;
                    mejorCarta = cards[i];
                }
            }

            let trucoMsg = `Jugá tu mejor carta, el ${mejorCarta.numero} de ${mejorCarta.palo}.`;
            if (maxJerarquia >= 11) trucoMsg = `Tenés carta fuerte, el ${mejorCarta.numero} de ${mejorCarta.palo}.`;
            if (maxJerarquia >= 13) trucoMsg = `Tenés un ancho, el ${mejorCarta.numero} de ${mejorCarta.palo}. Inganable.`;

            return envidoMsg + trucoMsg;
        }

        // --- COMPUTER VISION: PROCESAMIENTO DE IMAGEN ---
        function processFrame() {
            // Capturar fotograma al Canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // AQUI VA LA LÓGICA DE DETECCIÓN REAL USANDO OPENCV.JS
            // const src = cv.imread(canvas);
            // cv.cvtColor(src, src, cv.COLOR_RGBA2GRAY, 0);
            // ... (Algoritmo de detección de bordes, contornos y Template Matching)
            // src.delete();
            
            /* --- SIMULADOR DE DETECCIÓN PARA PRUEBAS (Al no haber modelo externo) --- */
            // En un entorno de producción local real, requerirías descargar un archivo pre-entrenado (.xml o weights)
            // Aquí simulamos que la cámara está leyendo diferentes manos de cartas para demostrar el funcionamiento del motor.
            const dummyHands = [
                [{ numero: 7, palo: 'espada' }, { numero: 6, palo: 'espada' }, { numero: 1, palo: 'basto' }], // Envido 33, 1 basto
                [{ numero: 3, palo: 'copa' }, { numero: 2, palo: 'copa' }, { numero: 4, palo: 'oro' }],       // Envido 25, 3 copa
                [{ numero: 1, palo: 'espada' }, { numero: 7, palo: 'oro' }, { numero: 12, palo: 'espada' }],  // Envido 21, 1 espada
                [{ numero: 10, palo: 'basto' }, { numero: 11, palo: 'basto' }, { numero: 5, palo: 'basto' }]  // Envido 25, 5 basto
            ];
            
            const cartasDetectadas = dummyHands[mockIndex];
            mockIndex = (mockIndex + 1) % dummyHands.length; 
            /* ----------------------------------------------------------------------- */

            log("🔍 Fotograma analizado. Cartas detectadas en mano.");
            
            const recomendacion = analyzeTrucoState(cartasDetectadas);
            if (recomendacion) {
                speak(recomendacion);
            }
        }

        // --- CONTROL PRINCIPAL ---
        async function toggleAssistant() {
            if (isRunning) {
                // DETENER
                clearInterval(loopInterval);
                stopCamera();
                releaseWakeLock();
                window.speechSynthesis.cancel();
                
                isRunning = false;
                btn.textContent = "INICIAR ASISTENTE";
                btn.classList.remove('running');
                lastSpokenMessage = ""; // Resetear memoria de voz
                log("🛑 Asistente detenido.");
            } else {
                // INICIAR
                try {
                    initVoice(); // Desbloquear audio
                    await requestWakeLock(); // Bloquear apagado de pantalla
                    await startCamera(); // Iniciar lente
                    
                    isRunning = true;
                    btn.textContent = "DETENER ASISTENTE";
                    btn.classList.add('running');
                    log("✅ Asistente en marcha. Guardar en el bolsillo.");
                    speak("Asistente táctico iniciado.");

                    // Bucle ininterrumpido cada 4 segundos
                    loopInterval = setInterval(processFrame, 4000);
                } catch (error) {
                    log("❌ No se pudo iniciar el asistente. Revisa los permisos.");
                }
            }
        }

        // Event Listeners
        btn.addEventListener('click', toggleAssistant);
        
        // Reconectar WakeLock si la pestaña cambia de visibilidad
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && isRunning) {
                await requestWakeLock();
            }
        });
    </script>
    <FollowUp>
</body>
</html>
